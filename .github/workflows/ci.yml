name: CI

on:
  pull_request:

# Read-only access: no step can push code, comment, or change repository settings
permissions:
  contents: read

# A new push to the same pull request cancels the run still going for the older commit
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    # The gym PC runs Windows, so the checks do too
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
      # U2a adds a step here that fails when the database schema and its migrations drift apart (KTD17)

  repo-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the steps below can compare this pull request with its base branch
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting needs write access; findings show in the job summary instead
          GITLEAKS_ENABLE_COMMENTS: false
      - name: Block binary files outside e2e/fixtures
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # git marks a binary file with "-" in both count columns
          binaries=$(git diff --numstat --no-renames --diff-filter=d "origin/$BASE_REF...HEAD" \
            | awk -F'\t' '$1 == "-" && $2 == "-" && $3 !~ /^e2e\/fixtures\// { print $3 }')
          if [ -n "$binaries" ]; then
            echo "::error::Binary files belong only in e2e/fixtures/. Never commit member photos, databases, or certificates."
            printf '%s\n' "$binaries"
            exit 1
          fi
          echo "No binary files outside e2e/fixtures/."
